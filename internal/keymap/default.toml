# Default key bindings (tech-design §6.8). Same format as the user's
# keymaps.toml, which is loaded on top. Only keys every terminal can tell apart
# (§6.2): no Alt, no Ctrl+Shift, no modified Enter, no Ctrl+digit, no C-i/C-m/C-[.

[keys]
leader = "<Space>"

[keys.global]
"<C-p>" = "palette.open"
"<C-s>" = "save"
"<C-c>" = "cancel"

[keys.normal]
"<C-h>" = "pane.focus.left" # C-h is Backspace in a few terminals: NORMAL only
"<C-j>" = "pane.focus.down"
"<C-k>" = "pane.focus.up"
"<C-l>" = "pane.focus.right"
# Only the common keys (§6.8). Everything else runs from the palette, or
# gets a key in keymaps.toml: "<Leader>h" = "pane.focus.left".
"<Leader>s" = "session.list"
"<Leader>)" = "session.next"
"<Leader>(" = "session.prev"
"<Leader>L" = "session.last"
"<Leader>c" = "window.new"
"<Leader>n" = "window.next"
"<Leader>p" = "window.prev"
"<Leader>l" = "window.last"
"<Leader>%" = "pane.split.right"
'<Leader>"' = "pane.split.below"
"<Leader>z" = "pane.zoom"
"<Leader>x" = "pane.close"
"<Leader>q" = "pane.number"
"<Leader>b" = "tree.toggle"
"<Leader>>" = "tree.wider" # the sidebar's edge, from any pane; in the tree > < = alone (§7.8)
"<Leader><" = "tree.narrower"
"<Leader>r" = "result.toggle"
"?" = "keyhelp.open" # every pane in NORMAL: a query's VISUAL ? stays vim's (§6.5)
"<Leader>?" = "keyhelp.open" # anywhere
"<Esc>" = "pane.error.close" # a query's VISUAL esc stays vim's: no normal scope there (§7.8)
"gt" = "tab.next"
"gT" = "tab.prev"
"<Leader>wn" = "tab.move.next" # the tab goes to the next pane clockwise, the focus after it (F12.5)
"<Leader>wp" = "tab.move.prev"

[keys.grid]
"h" = "grid.left"
"j" = "grid.down"
"k" = "grid.up"
"l" = "grid.right"
"<Left>" = "grid.left" # the arrow keys are nvim's NORMAL as well (F16.6)
"<Down>" = "grid.down"
"<Up>" = "grid.up"
"<Right>" = "grid.right"
"<Tab>" = "grid.right" # every row alike: one more key for the way a form moves (F8.6)
"<S-Tab>" = "grid.left"
"gg" = "grid.top"
"G" = "grid.bottom"
"0" = "grid.first"
"^" = "grid.first" # the same as 0: no indent here
"<C-r>" = "where.history" # from the grid: the WHERE gets the keys first (F9.4)
"$" = "grid.last"
"<CR>" = "grid.edit"
"i" = "grid.edit"
"r" = "grid.revert"
"o" = "grid.row.add"
"dd" = "grid.row.delete"
"R" = "grid.refresh"
"T" = "grid.transpose"
"x" = "tab.close"
"/" = "grid.where"
"go" = "grid.order"
"gl" = "grid.limit"
"gp" = "grid.page"
"gc" = "grid.cols"
"ge" = "grid.export" # CSV or JSON, the page or all of it (F12.4)
"gs" = "grid.order.cycle" # this column alone, the other way, the default (F12.3)
"gS" = "grid.order.add" # joins the ORDER, or turns: space of its list
"gj" = "grid.view.json" # the page as JSON, read only (F14.5)
"gi" = "table.properties" # the table's properties, or its rows back
"*" = "grid.filter.cell" # the cell as a condition of the WHERE
"e" = "grid.value" # the cell in the value editor (F12.2)
"O" = "grid.value" # the same
"fv" = "grid.filter.cell" # the f group: what is done with this cell or column (F12.11)
"fc" = "grid.col.hide"
">" = "grid.col.wider" # the column the cursor is on one wider or narrower (a count: that many), the others as they were; = back to automatic (F17.14)
"<" = "grid.col.narrower"
"=" = "grid.col.fit"
"fe" = "grid.export"
"]" = "grid.page.next"
"[" = "grid.page.prev"
"s" = "jump.start" # flash-style jump to what is on the screen (F10.8)
"m" = "grid.select.toggle" # mark the record; space is the leader, so not yazi's (F10.7)
"v" = "grid.select.visual"
"V" = "grid.select.unset" # VISUAL that takes the range out of the selected (F12.12)
"yy" = "grid.yank.row"
"yl" = "grid.yank"
"p" = "grid.paste"
"yi" = "grid.yank.insert"
"Y" = "grid.yank.json"
# not in normal: a query's : and ; are its vim's (§6.8)
":" = "palette.open"
";" = "palette.sql"

[keys.select] # records marked, or VISUAL on a table: over grid, whose dd and yy do not make d and y wait (F10.7)
"d" = "grid.select.delete"
"y" = "grid.select.yank"
"<Esc>" = "grid.select.clear"

[keys.result] # stacked above grid, which the rest goes to (§6.4)
"P" = "result.pin"
"q" = "result.close"
"x" = "result.close"
"R" = "result.rerun"
"]" = "result.page.next" # a query's result, cut at max_rows: the next page of its statement (F10.4)
"[" = "result.page.prev"

[keys.tree]
"j" = "tree.down"
"k" = "tree.up"
"gg" = "tree.top"
"G" = "tree.bottom"
"l" = "tree.expand"
"h" = "tree.collapse"
"<Down>" = "tree.down"
"<Up>" = "tree.up"
"<Right>" = "tree.expand"
"<Left>" = "tree.collapse"
"<CR>" = "tree.open"
"t" = "tree.open.tab"
"/" = "tree.filter"
"<Esc>" = "tree.refilter" # with a filter kept: back to its input, as / (F20.9)
"R" = "tree.refresh"
">" = "tree.wider" # the sidebar's edge 4 columns (a count: that many times); = fits the longest name, or goes back (§7.8)
"<" = "tree.narrower"
"=" = "tree.fit"
"dd" = "tree.delete"
"s" = "jump.start"
":" = "palette.open"
";" = "palette.sql"

[keys.landing] # a new tab, or a pane with none (§5)
"t" = "tab.table"
"c" = "query.new"
"x" = "tab.close"
":" = "palette.open"
";" = "palette.sql"

[keys.jsonview] # a grid's JSON view: a vim over the text; paging and refresh are the grid's and the result's keys (F14.5, F15.9)
"<Esc>" = "json.leave" # NORMAL's brings the table back; the editor has it otherwise
"q" = "json.leave q" # esc first puts out the matches of a search lit, q leaves at once (F15.9)
"gj" = "grid.view.json"
"Y" = "json.yank" # the whole text, not the line vim's Y has (F16.9)
"s" = "jump.start" # (F16.8)

[keys.queryinsert] # a query in INSERT, where vim has C-r for a register (F14.2)
"<C-r>" = "query.history"

[keys.query] # NORMAL / VISUAL; everything else goes to the vim engine
"<CR>" = "query.run"
"s" = "jump.start" # over vim's s in NORMAL; in VISUAL it is the vim's still (F10.8)
"gs" = "query.schema"

[keys.palette] # quick SQL lives in the palette's SQL mode
"<Up>" = "palette.up"
"<Down>" = "palette.down"
"<C-p>" = "palette.up"
"<C-n>" = "palette.down"
"<CR>" = "palette.run"
"<Esc>" = "palette.close"
"<Tab>" = "palette.scope.next"
"<S-Tab>" = "palette.scope.prev"
"<C-t>" = "palette.open.tab"
"<C-y>" = "quicksql.copy"
"<C-f>" = "palette.preview.down" # the DDL preview of a table (F9.7)
"<C-b>" = "palette.preview.up"
"<C-o>" = "palette.preview.focus" # the focus into the preview: a read only text to move in, search, select and copy from (F17.6)
"<C-e>" = "quicksql.edit"

[keys.palettepreview] # the palette's preview has the focus: its vim keys, and esc to the list (F17.6)
"<Esc>" = "palette.preview.leave" # NORMAL's, with no search lit, takes the focus back; the editor has it otherwise

[keys.dropdown] # schema, LIMIT and the rest (§6.8): typing goes to the filter, so no j/k
"<Up>" = "dropdown.up"
"<Down>" = "dropdown.down"
"<C-p>" = "dropdown.up"
"<C-n>" = "dropdown.down"
"<CR>" = "dropdown.select"
"<Esc>" = "dropdown.close"

[keys.menu] # the right-click menus: the tree's (§7.8, F8.23) and the grid's (F12.3)
"j" = "menu.down"
"<Down>" = "menu.down"
"k" = "menu.up"
"<Up>" = "menu.up"
"<CR>" = "menu.run"
"<Esc>" = "menu.close"

[keys.value] # the value editor's box (F12.2): the rest goes to its vim
"<C-s>" = "value.save"
"<Esc>" = "value.leave" # NORMAL's closes it; the editor has it otherwise

[keys.ddl] # the table's DDL over the grid (§7.5, F9.8); the column's goes with any key
"j" = "ddl.down"
"<Down>" = "ddl.down"
"k" = "ddl.up"
"<Up>" = "ddl.up"
"<C-d>" = "ddl.page.down"
"<C-u>" = "ddl.page.up"
"gg" = "ddl.top"
"G" = "ddl.bottom"
"<Esc>" = "ddl.close"

[keys.complete] # §9.7: ↵ (takes the selected one and does no more, F8.1; with none selected it is the input's, F8.17) and esc are the input's; in quick SQL the palette's keys come next
"<Tab>" = "complete.down"
"<C-n>" = "complete.down"
"<Down>" = "complete.down"
"<S-Tab>" = "complete.up"
"<C-p>" = "complete.up"
"<Up>" = "complete.up"

[keys.where] # Q-02: the WHERE typed filters it
"<C-n>" = "where.down"
"<Tab>" = "where.down"
"<Down>" = "where.down"
"<C-p>" = "where.up"
"<S-Tab>" = "where.up"
"<Up>" = "where.up"
"<CR>" = "where.apply"
"<C-e>" = "where.edit"
"<C-f>" = "where.star"
"<Esc>" = "where.close"

[keys.wherenormal] # F3.39: the WHERE input in NORMAL; the rest goes to its vim, normal under it
"<CR>" = "where.run"
"/" = "where.history"
"<Esc>" = "where.leave"

[keys.keyhelp] # §6.5: the other keys it lists are pressed
"<Esc>" = "keyhelp.close"
"<BS>" = "keyhelp.back"
"<C-d>" = "keyhelp.scroll.down"
"<C-u>" = "keyhelp.scroll.up"

[keys.input] # every input
"<C-r>" = "where.history" # does something in the WHERE input only
"<C-f>" = "where.star" # so does this one (F9.2)

[keys.order] # the ORDER list (F12.9): the list has the keys until / gives them to the filter
"j" = "order.down"
"k" = "order.up"
"<Space>" = "order.toggle" # joins the sorting at the end, or turns
"a" = "order.remove"
"A" = "order.clear" # back to the default
"<CR>" = "order.only" # this column alone, and closes
"/" = "order.filter"
"<Esc>" = "order.close"

[keys.cols] # Q-04: the list has the keys until / gives them to the filter
"j" = "cols.down"
"k" = "cols.up"
"J" = "cols.move.down" # the column goes down / up a place, the table's order with it (F10.3)
"K" = "cols.move.up"
"<Space>" = "cols.toggle"
"a" = "cols.all"
"A" = "cols.none"
"/" = "cols.filter"
"<Esc>" = "cols.close"

[keys.jump] # a flash-style jump going on: the rest is the pattern, a label jumps (F10.8)
"<Esc>" = "jump.cancel"
"<BS>" = "jump.back"
"<CR>" = "jump.confirm"

[keys.sessions] # the session list (§7.8, S-03)
"j" = "sessions.down"
"k" = "sessions.up"
"l" = "sessions.expand"
"h" = "sessions.collapse"
"<CR>" = "sessions.attach"
"n" = "sessions.new"
"x" = "sessions.kill"
"$" = "sessions.rename"
"<Esc>" = "sessions.close"

[keys.conns] # the connection manager's list has the keys (§7.8, F8.16); the form has [keys.form]
"j" = "conns.down"
"<Down>" = "conns.down"
"k" = "conns.up"
"<Up>" = "conns.up"
"<Tab>" = "conns.form"
"l" = "conns.form"
"<Right>" = "conns.form"
"<CR>" = "conns.form"
"x" = "conns.delete"
"<C-s>" = "form.save" # the form's own, saved from the list too, not the global save of the table behind
"<C-t>" = "form.test" # connects with what the form says, once, and shows how it went (F12.5)
"<Esc>" = "conns.close"

[keys.form] # the connection form (§7.8); space flips a switch, the form's own
"<Tab>" = "form.next"
"<S-Tab>" = "form.prev"
"<CR>" = "form.save"
"<C-s>" = "form.save"
"<C-t>" = "form.test"
"<Esc>" = "form.cancel"

[keys.groups] # the connection form's group field with its list of the groups there are (F10.6): the form's keys come after
"<Tab>" = "form.group.tab"
"<CR>" = "form.group.enter"
"<Down>" = "form.group.next"
"<C-n>" = "form.group.next"
"<Up>" = "form.group.prev"
"<C-p>" = "form.group.prev"
"<Esc>" = "form.group.close"

[keys.engines] # the connection form's engine field with its list of the engines open: ↓ ↑ pick as they go, so ↵ is the form's save still; the form's keys come after
"<Down>" = "form.engine.next"
"<C-n>" = "form.engine.next"
"j" = "form.engine.next"
"<Up>" = "form.engine.prev"
"<C-p>" = "form.engine.prev"
"k" = "form.engine.prev"
"<Esc>" = "form.engine.close"

[keys.confirm] # §10.5: before changes are thrown away
"y" = "confirm.yes"
"<CR>" = "confirm.yes"
"n" = "confirm.no"
"<Esc>" = "confirm.no"

[keys.newrow] # F3.33: a cell of a row added, over its options' and segments' keys
"<Tab>" = "cell.field.next"
"<S-Tab>" = "cell.field.prev"

[keys.options] # §10.2: a cell's options, while they show (a time's: segments)
"<Tab>" = "cell.option.next"
"<C-n>" = "cell.option.next"
"<Down>" = "cell.option.next"
"<S-Tab>" = "cell.option.prev"
"<C-p>" = "cell.option.prev"
"<Up>" = "cell.option.prev"

[keys.segments] # §10.2: a time's parts and its options' row, while they show
"<Tab>" = "cell.segment.next"
"<S-Tab>" = "cell.segment.prev"
"<Up>" = "cell.up"
"<Down>" = "cell.down"
"<C-n>" = "cell.option.next"
"<C-p>" = "cell.option.prev"

[keys.cell] # §10.2: the rest is the text's
"<CR>" = "cell.accept"
"<Esc>" = "cell.done"
