# Default key bindings (tech-design §6.8). Same format as the user's
# config.toml, which is loaded on top. Only keys every terminal can tell apart
# (§6.2): no Alt, no Ctrl+Shift, no modified Enter, no Ctrl+digit, no C-i/C-m/C-[.

[keys]
leader = "<Space>"

[keys.global]
"<C-p>" = "palette.open"
"<C-s>" = "save"
"<C-c>" = "cancel"

[keys.normal]
"<C-h>" = "pane.focus.left" # C-h is Backspace in a few terminals: NORMAL only
"<C-j>" = "pane.focus.down"
"<C-k>" = "pane.focus.up"
"<C-l>" = "pane.focus.right"
# Only the common keys (§6.8). Everything else runs from the palette, or
# gets a key in config.toml: "<Leader>h" = "pane.focus.left".
"<Leader>s" = "session.list"
"<Leader>c" = "window.new"
"<Leader>n" = "window.next"
"<Leader>p" = "window.prev"
"<Leader>l" = "window.last"
"<Leader>%" = "pane.split.right"
'<Leader>"' = "pane.split.below"
"<Leader>z" = "pane.zoom"
"<Leader>x" = "pane.close"
"<Leader>q" = "pane.number"
"<Leader>b" = "tree.toggle"
"<Leader>?" = "keyhelp.open" # anywhere, a console too: its ? is vim's (§6.5)
"<Esc>" = "pane.error.close" # a console's VISUAL esc stays vim's: no normal scope there (§7.8)
"gt" = "tab.next"
"gT" = "tab.prev"

[keys.grid]
"h" = "grid.left"
"j" = "grid.down"
"k" = "grid.up"
"l" = "grid.right"
"gg" = "grid.top"
"G" = "grid.bottom"
"0" = "grid.first"
"$" = "grid.last"
"<CR>" = "grid.edit"
"i" = "grid.edit"
"r" = "grid.revert"
"o" = "grid.row.add"
"dd" = "grid.row.delete"
"R" = "grid.refresh"
"T" = "grid.transpose"
"x" = "tab.close"
"/" = "grid.where"
"go" = "grid.order"
"gl" = "grid.limit"
"gp" = "grid.page"
"gc" = "grid.cols"
"]" = "grid.page.next"
"[" = "grid.page.prev"
"yy" = "grid.yank"
"yi" = "grid.yank.insert"
"?" = "keyhelp.open"
# not in normal: a console's : and ; are its vim's (§6.8)
":" = "palette.command"
";" = "palette.sql"

[keys.result] # stacked above grid, which the rest goes to (§6.4)
"P" = "result.pin"
"q" = "result.close"
"x" = "result.close"
"R" = "result.rerun"

[keys.tree]
"j" = "tree.down"
"k" = "tree.up"
"gg" = "tree.top"
"G" = "tree.bottom"
"l" = "tree.expand"
"h" = "tree.collapse"
"<CR>" = "tree.open"
"t" = "tree.open.tab"
"/" = "tree.filter"
"R" = "tree.refresh"
"?" = "keyhelp.open"
":" = "palette.command"
";" = "palette.sql"

[keys.landing] # a new tab, or a pane with none (§5)
"t" = "tab.table"
"c" = "console.new"
"x" = "tab.close"
"?" = "keyhelp.open"
":" = "palette.command"
";" = "palette.sql"

[keys.console] # NORMAL / VISUAL; everything else goes to the vim engine
"<CR>" = "console.run"
"gs" = "console.schema"

[keys.palette] # quick SQL lives in the palette's SQL mode
"<Up>" = "palette.up"
"<Down>" = "palette.down"
"<C-p>" = "palette.up"
"<C-n>" = "palette.down"
"<CR>" = "palette.run"
"<Esc>" = "palette.close"
"<Tab>" = "palette.scope.next"
"<S-Tab>" = "palette.scope.prev"
"<C-t>" = "palette.open.tab"
"<C-y>" = "quicksql.copy"
"<C-e>" = "quicksql.edit"

[keys.dropdown] # schema, ORDER, LIMIT (§6.8): typing goes to the filter, so no j/k
"<Up>" = "dropdown.up"
"<Down>" = "dropdown.down"
"<C-p>" = "dropdown.up"
"<C-n>" = "dropdown.down"
"<CR>" = "dropdown.select"
"<Esc>" = "dropdown.close"

[keys.complete] # §9.7: ↵ (takes the selected one, runs if that changes nothing) and esc are the input's
"<Tab>" = "complete.down"
"<C-n>" = "complete.down"
"<Down>" = "complete.down"
"<S-Tab>" = "complete.up"
"<C-p>" = "complete.up"
"<Up>" = "complete.up"

[keys.where] # Q-02: the WHERE typed filters it
"<C-n>" = "where.down"
"<C-p>" = "where.up"
"<CR>" = "where.apply"
"<C-f>" = "where.star"
"<Esc>" = "where.close"

[keys.keyhelp] # §6.5: the other keys it lists are pressed
"<Esc>" = "keyhelp.close"
"<BS>" = "keyhelp.back"
"<C-d>" = "keyhelp.scroll.down"
"<C-u>" = "keyhelp.scroll.up"

[keys.input] # every input
"<C-r>" = "where.history" # does something in the WHERE input only

[keys.cols] # Q-04: the list has the keys until / gives them to the filter
"j" = "cols.down"
"k" = "cols.up"
"<Space>" = "cols.toggle"
"a" = "cols.all"
"A" = "cols.none"
"/" = "cols.filter"
"<Esc>" = "cols.close"

[keys.confirm] # §10.5: before changes are thrown away
"y" = "confirm.yes"
"<CR>" = "confirm.yes"
"n" = "confirm.no"
"<Esc>" = "confirm.no"

[keys.options] # §10.2: a cell's options, while they show (a time's: segments)
"<Tab>" = "cell.option.next"
"<C-n>" = "cell.option.next"
"<Down>" = "cell.option.next"
"<S-Tab>" = "cell.option.prev"
"<C-p>" = "cell.option.prev"
"<Up>" = "cell.option.prev"

[keys.segments] # §10.2: a time's parts and its options' row, while they show
"<Tab>" = "cell.segment.next"
"<S-Tab>" = "cell.segment.prev"
"<Up>" = "cell.up"
"<Down>" = "cell.down"
"<C-n>" = "cell.option.next"
"<C-p>" = "cell.option.prev"

[keys.cell] # §10.2: the rest is the text's
"<CR>" = "cell.accept"
"<Esc>" = "cell.done"
