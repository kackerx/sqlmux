# tech-design §15「CI」: lint, vet and unit tests, and the integration tests
# on PG 17, MySQL 8.4, SQL Server 2022, ClickHouse 25.8 and Trino 478 with
# testdata/seed loaded. e2e is
# not run here: it needs a terminal and tmux (AGENTS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release.yml runs the same checks before it builds

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0 # the same as the justfile's
          install-mode: goinstall # built with setup-go's Go, which go.mod's version needs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./...
      - name: the benchmarks run (a go test without -bench only compiles them)
        run: go test -run '^$' -bench . -benchtime 1x ./internal/app/
      - name: gofmt and go mod tidy leave nothing to change
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go mod tidy
          git diff --exit-code go.mod go.sum

  windows: # the windows half of the unit tests: no integration (no databases), no lint (§15)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... # GOOS=windows on this runner
      - run: go build ./...
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sqlmux
          POSTGRES_PASSWORD: sqlmux
          POSTGRES_DB: sqlmux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sqlmux -d sqlmux"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlmux
          MYSQL_USER: sqlmux
          MYSQL_PASSWORD: sqlmux
          MYSQL_DATABASE: sqlmux
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usqlmux -psqlmux"
          --health-interval 2s --health-retries 30
      redis: # redis-stack-server, for RedisJSON (M16)
        image: redis/redis-stack-server:7.4.0-v3
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
      mssql: # F18.6; the image is amd64, which this runner is
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sqlmux!2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P Sqlmux!2026 -Q 'select 1'"
          --health-interval 5s --health-retries 40 --health-start-period 30s
      clickhouse: # §8.9: the HTTP interface the tests use, and the native port the seed's client loads by
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: sqlmux
          CLICKHOUSE_PASSWORD: sqlmux
          CLICKHOUSE_DB: sqlmux
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user sqlmux --password sqlmux -q 'select 1'"
          --health-interval 2s --health-retries 60
    env:
      SQLMUX_TEST_PG: postgres://sqlmux:sqlmux@localhost:5432/sqlmux?sslmode=disable
      SQLMUX_TEST_MYSQL: sqlmux:sqlmux@tcp(localhost:3306)/sqlmux
      SQLMUX_TEST_REDIS: redis://localhost:6379/0
      SQLMUX_TEST_MSSQL: 'sqlserver://sa:Sqlmux!2026@localhost:1433?database=sqlmux&TrustServerCertificate=true'
      SQLMUX_TEST_CLICKHOUSE: clickhouse://sqlmux:sqlmux@localhost:8123/sqlmux
      SQLMUX_TEST_TRINO: trino://sqlmux@localhost:8080/postgresql/public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # docker-compose.yml mounts the seeds into the images' init directory;
      # a service container cannot, so they are loaded here, the MySQL one as
      # root as the image would, and SQL Server's with its own image's sqlcmd,
      # which makes the sqlmux database the seed starts with (F18.6)
      - name: load the seeds
        run: |
          PGPASSWORD=sqlmux psql -h localhost -U sqlmux -d sqlmux -v ON_ERROR_STOP=1 -f testdata/seed/pg.sql
          mysql -h 127.0.0.1 -uroot -psqlmux sqlmux < testdata/seed/mysql.sql
          docker run -i --rm --network host redis/redis-stack-server:7.4.0-v3 redis-cli -h 127.0.0.1 < testdata/seed/redis.txt
          docker run -i --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd mcr.microsoft.com/mssql/server:2022-latest -C -b -S localhost -U sa -P 'Sqlmux!2026' < testdata/seed/mssql.sql
          docker run -i --rm --network host --entrypoint clickhouse-client clickhouse/clickhouse-server:25.8 --host 127.0.0.1 --user sqlmux --password sqlmux --multiquery < testdata/seed/clickhouse.sql
      # §8.10: Trino's catalogs are files, which a service container cannot be
      # given before the checkout; its postgresql catalog is the PG above, by the
      # name docker-compose.yml gives it
      - name: start trino
        run: |
          docker run -d --name trino --network host --add-host postgres:127.0.0.1 -v "$PWD/testdata/seed/trino:/etc/trino/catalog:ro" trinodb/trino:478
          for i in $(seq 90); do
            curl -sf localhost:8080/v1/info | grep -q '"starting":false' && exit 0
            sleep 2
          done
          docker logs trino | tail -50
          exit 1
      - run: go test -tags integration ./...
