# Databases for the integration tests and e2e (tech-design §15). Ports stay
# off the local defaults so a developer's own PG / MySQL / ClickHouse keeps running.
#   docker compose up -d --wait
#   SQLMUX_TEST_PG='postgres://sqlmux:sqlmux@localhost:55432/sqlmux?sslmode=disable' \
#   SQLMUX_TEST_MYSQL='sqlmux:sqlmux@tcp(localhost:53306)/sqlmux' go test -tags integration ./...
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sqlmux
      POSTGRES_PASSWORD: sqlmux
      POSTGRES_DB: sqlmux
    ports: ["55432:5432"]
    volumes: ["./testdata/seed/pg.sql:/docker-entrypoint-initdb.d/pg.sql:ro"]
    healthcheck:
      # over TCP: while the seed runs, the image's init server only listens on the socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sqlmux", "-d", "sqlmux"]
      interval: 1s
      retries: 30

  mysql: # M5
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlmux
      MYSQL_USER: sqlmux
      MYSQL_PASSWORD: sqlmux
      MYSQL_DATABASE: sqlmux
    ports: ["53306:3306"]
    volumes: ["./testdata/seed/mysql.sql:/docker-entrypoint-initdb.d/mysql.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usqlmux", "-psqlmux"]
      interval: 2s
      retries: 30

  # M16: redis-stack-server has RedisJSON. testdata/seed/redis.txt is db0 (one of
  # each type, a namespace tree, a hash of 6000 fields, 12000 keys) and db1 (two
  # keys), a command a line, loaded by redis-seed once: its JSON.SET fails
  # on a server with no RedisJSON. A TTL in it is ten years.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  redis-seed: # once: a data volume that has the seed already is left alone
    image: redis/redis-stack-server:7.4.0-v3
    depends_on:
      redis: {condition: service_healthy}
    volumes: ["./testdata/seed/redis.txt:/seed/redis.txt:ro"]
    entrypoint: ["sh", "-c", "[ \"$$(redis-cli -h redis exists seed:done)\" = 1 ] || redis-cli -h redis < /seed/redis.txt"]
    restart: "no"

  # F18.6, on 51433. The image is amd64 only: on an arm64 Mac it wants
  # Rosetta, and the Mac's worker, reviewer and tester use the Windows
  # host's container over Tailscale instead of this one.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Sqlmux!2026
    ports: ["51433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1' || exit 1"]
      interval: 3s
      retries: 40
      start_period: 20s

  mssql-seed: # once: sqlmux being in the server's databases means the seed ran
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql: {condition: service_healthy}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Sqlmux!2026
    volumes: ["./testdata/seed/mssql.sql:/seed/mssql.sql:ro"]
    entrypoint: ["/bin/bash", "-c", "q=\"/opt/mssql-tools18/bin/sqlcmd -C -b -W -S mssql -U sa -P $$MSSQL_SA_PASSWORD -h -1\"; [ \"$$($$q -Q 'set nocount on; select count(*) from sys.databases where name = ''sqlmux''')\" = 1 ] || $$q -i /seed/mssql.sql"]
    restart: "no"

  # ClickHouse over its HTTP interface, on 58123 (§8.9). The image loads
  # testdata/seed/clickhouse.sql on the first start of an empty volume.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: sqlmux
      CLICKHOUSE_PASSWORD: sqlmux
      CLICKHOUSE_DB: sqlmux
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["58123:8123"]
    volumes: ["./testdata/seed/clickhouse.sql:/docker-entrypoint-initdb.d/clickhouse.sql:ro"]
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "sqlmux", "--password", "sqlmux", "-q", "select count() from sqlmux.t_user"]
      interval: 1s
      retries: 60

  # Trino on 58080 (§8.10): catalogs memory, tpch (read-only sample data) and
  # postgresql, the seeded PG above, which takes UPDATE and DELETE. No seed of
  # its own: what a test writes it writes in memory or in a database of its own.
  trino:
    image: trinodb/trino:478
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["58080:8080"]
    volumes: ["./testdata/seed/trino:/etc/trino/catalog:ro"]
    healthcheck:
      test: ["CMD", "trino", "--execute", "select 1"]
      interval: 3s
      retries: 60
      start_period: 10s

  # Oracle Database 23ai Free on 51521, its PDB FREEPDB1 (§8.11). The image
  # makes the sqlmux user, then runs testdata/seed/oracle.sql as SYS on the
  # first start of an empty volume; that start takes a minute or two.
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: sqlmux
      APP_USER: sqlmux
      APP_USER_PASSWORD: sqlmux
    ports: ["51521:1521"]
    volumes: ["./testdata/seed/oracle.sql:/container-entrypoint-initdb.d/oracle.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60
      start_period: 30s
